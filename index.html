header{background:var(--head);color:var(--headink);padding:22px 22px 18px;border-bottom:3px solid var(--gold)}
header h1{font:600 1.7rem/1.15 Newsreader,Georgia,serif;margin:0 0 6px}
header p{margin:0;font-size:.92rem;opacity:.85}
.bar{height:3px;background:rgba(255,255,255,.15);margin-top:14px;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .4s}
#log{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;gap:14px}
#rbw{background:none;border:0;padding:0;cursor:pointer;flex:none;width:68px;height:68px}
.robot{width:68px;height:68px;overflow:visible}
.av{width:34px;height:34px;flex:none}
.r{display:flex;align-items:flex-end;gap:8px;align-self:flex-start;max-width:94%}
.r .m{max-width:none}
.rb-w{fill:#fff;stroke:#7d2f3a;stroke-width:3}
.rb-h{fill:#7d2f3a}
.rb-e{fill:#ffd9cc}
.rb-m{fill:none;stroke:#ffd9cc;stroke-width:2.5;stroke-linecap:round}
.rb-a{fill:#e8896f}
.eye,.mouth,.arm,.arm2{transform-box:fill-box}
.eye{transform-origin:center;animation:blink 4.5s infinite}
.mouth{transform-origin:center}
.arm{transform-origin:50% 12%}
.arm2{transform-origin:50% 12%}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes wv{from{transform:rotate(-105deg)}to{transform:rotate(-160deg)}}
@keyframes mt{from{transform:scaleY(1)}to{transform:scaleY(.25)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-7px)}}
.robot.wave .arm{animation:wv .45s ease-in-out 6 alternate;animation-fill-mode:forwards}
.robot.talk .mouth{animation:mt .28s ease-in-out infinite alternate}
.robot.talk .ant{animation:blink .6s infinite}
.robot.happy{animation:hop .5s ease-in-out 4}
.robot.happy .arm{transform:rotate(-150deg)}
.robot.happy .arm2{transform:rotate(150deg)}
@media (prefers-reduced-motion:reduce){.robot,.robot *,.av *{animation:none!important}}
.m{max-width:84%;padding:11px 14px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word}
.m.bot{background:var(--bot);border:1px solid var(--line);border-bottom-left-radius:4px;align-self:flex-start}
.m.me{background:var(--me);color:var(--meink);border-bottom-right-radius:4px;align-self:flex-end}
.dots span{display:inline-block;width:6px;height:6px;margin-right:3px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dots span{animation:none}}
.opts{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 8px}
.opts button,.act button,.act a{font:500 .95rem "Instrument Sans",sans-serif;border:1.5px solid var(--head);background:transparent;color:var(--ink);padding:9px 15px;border-radius:999px;cursor:pointer;text-decoration:none}
:root[data-theme="dark"] .opts button{border-color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .opts button{border-color:var(--gold)}}
.opts button:hover,.act button:hover{background:var(--gold);border-color:var(--gold);color:#2a1010}
.act{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 10px}
.act .p{background:var(--head);color:var(--headink)}
form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:color-mix(in srgb,var(--panel) 85%,transparent)}
input{flex:1;font:inherit;padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bot);color:var(--ink);min-width:0}
input:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
form button{font:600 1rem "Instrument Sans",sans-serif;background:var(--gold);color:#2a1010;border:0;border-radius:12px;padding:0 18px;cursor:pointer}
form.off{display:none}
#adm{display:none;margin:0 16px 10px;font-size:.85rem;color:var(--muted)}
#adm button{background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;font:inherit;padding:0}
#list{display:none;margin:0 16px 12px;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:.85rem;max-height:200px;overflow:auto;background:var(--bot)}
</style>
</head>
<body>
<div class="app">
<header>
<div class="top"><button id="rbw" type="button" aria-label="Cumprimentar o SanTO"></button><div><h1>Cura da História da Vida</h1>
<p>Retiro de carnaval · 05 a 08 de fevereiro de 2027</p></div></div>
<div class="bar"><i id="pg"></i></div>
</header>
<div id="log" aria-live="polite"></div>
<div id="opts" class="opts"></div>
<div id="act" class="act"></div>
<div id="adm"><button id="admb">Ver inscrições recebidas</button></div>
<div id="list"></div>
<form id="f" class="off" autocomplete="off"><input id="in" aria-label="Sua resposta"><button>Enviar</button></form>
</div>
<script>
// Número do organizador com DDI+DDD, só dígitos (ex.: "5561999999999"). Vazio = sem botão de WhatsApp.
var ORG_WHATSAPP = "5561981316593";
// Endereço do Google Apps Script (termina em /exec). Vazio = não grava na planilha.
var SHEET_URL = "https://script.google.com/macros/s/AKfycbwC3ASiAsSU0dCTzK6DeL18dbIZJfjQAYbueMJa9aV9b8-MiLlkn88P3sd5R8B7GNPf/exec";

var STEPS = [
 {k:"nome",q:"Qual é o seu nome completo?",v:function(t){return t.trim().split(/\s+/).length>=2||"Digite nome e sobrenome."}},
 {k:"whats",q:"Qual é o seu WhatsApp, com DDD?",v:function(t){var d=t.replace(/\D/g,"");return (d.length>=10&&d.length<=13)||"Digite o número com DDD, por exemplo 61 99999-9999."}},
 {k:"email",q:"E o seu e-mail?",v:function(t){return /^\S+@\S+\.\S+$/.test(t.trim())||"Esse e-mail parece incompleto. Confira e envie de novo."}},
 {k:"nasc",q:"Qual é a sua data de nascimento? (dd/mm/aaaa)",v:function(t){var m=t.trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(!m)return "Use o formato dd/mm/aaaa.";var y=+m[3];return (y>1920&&y<2012&&+m[2]>=1&&+m[2]<=12&&+m[1]>=1&&+m[1]<=31)||"Confira a data informada."}},
 {k:"cidade",q:"Em qual cidade você mora?",v:function(t){return t.trim().length>=2||"Digite o nome da cidade."}},
 {k:"primeira",q:"É o seu primeiro retiro desse tipo?",c:["Sim, é o primeiro","Já participei de outros"]},
 {k:"saude",q:"Tem alguma restrição alimentar, alergia ou cuidado de saúde que a equipe deva saber?",c:["Nenhuma"],ph:"Ou escreva aqui"},
 {k:"emerg",q:"Para sua segurança: nome e telefone de uma pessoa de contato para emergências.",v:function(t){return t.trim().length>=8||"Informe nome e telefone."}},
 {k:"pagto",q:"Qual forma de pagamento você prefere?",c:["PIX","Cartão de crédito","Cartão de débito"],ph:"Escolha uma das opções",v:function(t){return ["PIX","Cartão de crédito","Cartão de débito"].indexOf(t)>-1||"Escolha uma das opções: PIX, Cartão de crédito ou Cartão de débito."}},
 {k:"obs",q:"Quer deixar alguma mensagem ou pergunta para a equipe organizadora?",c:["Não, obrigado(a)"],ph:"Ou escreva aqui"}
];
var LABEL={nome:"Nome",whats:"WhatsApp",email:"E-mail",nasc:"Nascimento",cidade:"Cidade",primeira:"Primeiro retiro",saude:"Saúde/alimentação",emerg:"Contato de emergência",pagto:"Forma de pagamento",obs:"Mensagem"};
var $=function(i){return document.getElementById(i)};
var log=$("log"),inp=$("in"),form=$("f"),opts=$("opts"),act=$("act");
var i=0,data={},busy=false,wait=false;

function robot(c){return '<svg class="'+c+'" viewBox="0 0 80 80" aria-hidden="true"><line x1="40" y1="9" x2="40" y2="17" stroke="#7d2f3a" stroke-width="3"/><circle class="ant rb-a" cx="40" cy="7" r="4"/><rect class="rb-h" x="7" y="28" width="7" height="12" rx="3"/><rect class="rb-h" x="66" y="28" width="7" height="12" rx="3"/><rect class="rb-w" x="14" y="16" width="52" height="38" rx="14"/><rect class="rb-h" x="20" y="22" width="40" height="26" rx="10"/><ellipse class="eye rb-e" cx="32" cy="33" rx="3.5" ry="4.5"/><ellipse class="eye rb-e" cx="48" cy="33" rx="3.5" ry="4.5"/><path class="mouth rb-m" d="M33 41 Q40 47 47 41"/><rect class="arm2 rb-h" x="10" y="58" width="9" height="15" rx="4.5"/><rect class="rb-h" x="22" y="56" width="36" height="20" rx="8"/><circle class="rb-a" cx="40" cy="66" r="4.5"/><rect class="arm rb-h" x="61" y="58" width="9" height="15" rx="4.5"/></svg>'}
function mood(c,ms){var r=$("rbw").firstChild;if(!r)return;r.setAttribute("class","robot "+(c||""));if(ms)setTimeout(function(){r.setAttribute("class","robot")},ms)}
function add(text,who){var d=document.createElement("div");d.className="m "+who;d.textContent=text;if(who==="bot"){var r=document.createElement("div");r.className="r";r.innerHTML=robot("av");r.appendChild(d);log.appendChild(r)}else log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
function bot(text,cb){
  var d=add("","bot");d.innerHTML='<span class="dots"><span></span><span></span><span></span></span>';
  mood("talk");
  setTimeout(function(){d.textContent=text;log.scrollTop=log.scrollHeight;mood("");cb&&cb()},Math.min(1500,450+text.length*9));
}
function botSeq(a,cb){(function n(k){if(k>=a.length)return cb&&cb();bot(a[k],function(){n(k+1)})})(0)}
function clearUI(){opts.innerHTML="";act.innerHTML="";form.className="off"}
function btn(parent,label,fn,cls){var b=document.createElement("button");b.textContent=label;if(cls)b.className=cls;b.onclick=fn;parent.appendChild(b)}

function startFlow(label){add(label,"me");clearUI();ask()}
function intro(){
  clearUI();log.innerHTML="";i=0;data={};
  mood("wave",3200);
  botSeq([
    "Oi! 👋 Eu sou o SanTO, o assistente virtual do retiro.",
    "Aqui você faz a sua inscrição para o retiro “Cura da História da Vida”, de 05 a 08 de fevereiro de 2027, no feriado de carnaval.",
    "São só "+STEPS.length+" perguntas rápidas, cerca de 2 minutos, e eu te acompanho em cada uma. Vamos começar?"
  ],function(){
    opts.innerHTML="";
    btn(opts,"Sim, vamos começar!",function(){startFlow("Sim, vamos começar!")});
    btn(opts,"Tenho uma dúvida",function(){add("Tenho uma dúvida","me");clearUI();bot("Local e valores são confirmados pela organização depois da sua inscrição. O pagamento pode ser feito por PIX, cartão de crédito ou cartão de débito.\nSe preferir falar com uma pessoa, conclua a inscrição e a equipe entra em contato pelo WhatsApp.",function(){btn(opts,"Quero me inscrever",function(){startFlow("Quero me inscrever")})})});
  });
}
function progress(){$("pg").style.width=Math.round(i/STEPS.length*100)+"%"}
function ask(){
  progress();
  if(i>=STEPS.length)return review();
  var s=STEPS[i];
  bot(s.q,function(){
    form.className="";inp.placeholder=s.ph||"Digite aqui";inp.focus();
    opts.innerHTML="";(s.c||[]).forEach(function(c){btn(opts,c,function(){answer(c)})});
  });
}
function answer(t){
  if(wait)return;t=(t||"").trim();if(!t)return;
  var s=STEPS[i];
  if(s.v){var r=s.v(t);if(r!==true){add(t,"me");bot(r);return}}
  add(t,"me");data[s.k]=t;i++;clearUI();ask();
}
form.onsubmit=function(e){e.preventDefault();var t=inp.value;inp.value="";answer(t)};

function summary(){return STEPS.map(function(s){return LABEL[s.k]+": "+data[s.k]}).join("\n")}
function review(){
  clearUI();
  bot("Confira seus dados:\n\n"+summary()+"\n\nTudo certo para enviar a inscrição?",function(){
    btn(opts,"Confirmar inscrição",save);
    btn(opts,"Corrigir tudo",function(){add("Corrigir tudo","me");clearUI();bot("Sem problema, vamos refazer.",function(){i=0;data={};ask()})});
  });
}
async function save(){
  add("Confirmar inscrição","me");clearUI();
  var id="i"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  var rec=Object.assign({},data,{criadoEm:new Date().toISOString()});
  var saved=false;
  try{if(SHEET_URL){await fetch(SHEET_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(rec)})}}catch(e){}
  try{
    var db=await claude.use("db"),us=await claude.use("user");
    if(db&&us){id=await us.id();await db.collection("registrations").doc(id).set(rec);saved=true}
  }catch(e){}
  progress();$("pg").style.width="100%";
  var msg="Obrigado, "+data.nome.split(" ")[0]+"! 🙏\nFalta só um passo: toque no botão “Enviar minha inscrição por WhatsApp” abaixo para a equipe receber os seus dados. A inscrição só vale depois de enviada.\n\nDepois disso, a equipe responde com as informações de local, valores e como concluir o pagamento na forma escolhida.";
  bot(msg,function(){
    mood("happy",2400);
    var text="Inscrição · Retiro Cura da História da Vida (05 a 08/02/2027)\n\n"+summary();
    if(ORG_WHATSAPP){var a=document.createElement("a");a.className="p";a.target="_blank";a.rel="noopener";a.textContent="Enviar minha inscrição por WhatsApp";a.href="https://wa.me/"+ORG_WHATSAPP+"?text="+encodeURIComponent(text);act.appendChild(a)}
    btn(act,"Copiar meus dados",function(e){var b=e.target;try{navigator.clipboard.writeText(text).then(function(){b.textContent="Copiado"})}catch(x){b.textContent="Não foi possível copiar"}});
    btn(act,"Nova inscrição",intro);
  });
}

// Painel simples para o organizador (só aparece para quem pode editar)
(async function(){
  try{
    var u=await claude.use("user");
    if(!u||!u.isOwner())return;
    $("adm").style.display="block";
    $("admb").onclick=async function(){
      var L=$("list");L.style.display="block";L.textContent="Carregando…";
      try{
        var db=await claude.use("db");var snap=await db.collection("registrations").get();
        if(snap.empty){L.textContent="Nenhuma inscrição ainda.";return}
        L.textContent="";var h=document.createElement("div");h.textContent=snap.size+" inscrição(ões):";h.style.fontWeight="600";L.appendChild(h);
        snap.docs.forEach(function(d){var x=d.data();var p=document.createElement("div");p.style.marginTop="8px";p.textContent=x.nome+" · "+x.whats+" · "+x.cidade;L.appendChild(p)});
        var csvBtn=document.createElement("button");csvBtn.textContent="Baixar CSV";csvBtn.style.marginTop="10px";
        csvBtn.onclick=async function(){
          var dl=await claude.use("downloads");if(!dl)return;
          var keys=Object.keys(LABEL);
          var rows=[keys.join(",")].concat(snap.docs.map(function(d){var x=d.data();return keys.map(function(k){return '"'+String(x[k]||"").replace(/"/g,'""')+'"'}).join(",")}));
          try{await dl.save({filename:"inscricoes-retiro.csv",data:rows.join("\n")})}catch(e){}
        };L.appendChild(csvBtn);
      }catch(e){L.textContent="Não foi possível carregar as inscrições."}
    };
  }catch(e){}
})();

$("rbw").innerHTML=robot("robot");$("rbw").onclick=function(){mood("wave",3000)};
intro();
</script>
</body>
</html>
